<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Comprobantes · CONTSERTRIB FACTURACIÓN</title><style>
.doc-tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}.doc-tab{padding:10px 13px;border:1px solid #dbe3ee;border-radius:10px;background:#fff;font-weight:700;cursor:pointer}.doc-tab.active{background:#0f2747;color:#fff}.doc-panel{background:#fff;border:1px solid #e5e7eb;border-radius:16px;padding:20px}.doc-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.doc-grid label{font-size:12px;font-weight:700;color:#334155}.doc-grid input,.doc-grid select,.doc-grid textarea{width:100%;box-sizing:border-box;padding:11px;border:1px solid #cbd5e1;border-radius:9px;margin-top:5px}.doc-grid .full{grid-column:1/-1}.doc-actions{margin-top:16px;display:flex;gap:8px;flex-wrap:wrap}.doc-btn{border:0;border-radius:9px;padding:11px 15px;font-weight:700;background:#0f2747;color:#fff;cursor:pointer}.doc-btn.secondary{background:#e2e8f0;color:#0f2747}.doc-table{width:100%;border-collapse:collapse;margin-top:20px}.doc-table th,.doc-table td{padding:10px;border-bottom:1px solid #e5e7eb;text-align:left;font-size:12px}.muted{color:#64748b;font-size:13px}.warning{padding:12px;border-radius:10px;background:#fff7ed;color:#9a3412;margin:12px 0;font-size:13px}.ok{padding:12px;border-radius:10px;background:#ecfdf5;color:#065f46;margin:12px 0;font-size:13px}@media(max-width:700px){.doc-grid{grid-template-columns:1fr}.doc-grid .full{grid-column:auto}}
</style></head><body><main class="contenedor"><div class="doc-tabs" id="tabs"></div><section class="doc-panel"><h2 id="titulo"></h2><p class="muted" id="ayuda"></p><div id="reglas"></div><form id="form" class="doc-grid"><label>Identificación<input id="identificacion" placeholder="Cédula / RUC"></label><label>Razón social / nombres<input id="razon" placeholder="Se completará al consultar"></label><label>Correo electrónico<input id="email" type="email"></label><label>Documento sustento<input id="sustento" placeholder="001-001-000000001"></label><label class="full">Detalle / motivo<textarea id="detalle" rows="3"></textarea></label><label class="full">Datos SRI (JSON técnico)<textarea id="datos" rows="12" placeholder="Aquí puedes trabajar con el objeto técnico exigido por el SRI."></textarea></label><div class="doc-actions full"><button type="button" class="doc-btn" id="consultar">🔎 Consultar identificación</button><button type="button" class="doc-btn secondary" id="plantilla">📋 Cargar plantilla SRI</button><button class="doc-btn">💾 Guardar borrador</button></div></form><div id="msg" class="muted"></div><table class="doc-table"><thead><tr><th>Fecha</th><th>Tipo</th><th>Estado</th><th>Identificación</th><th>Acción</th></tr></thead><tbody id="lista"></tbody></table></section></main><script>
const tipos=[['nota_credito','Nota de crédito'],['nota_debito','Nota de débito'],['liquidacion_compra','Liquidación de compra'],['guia_remision','Guía de remisión'],['retencion','Comprobante de retención']];const p=new URLSearchParams(location.search);let tipo=p.get('tipo')||'nota_credito',emisorId=p.get('emisorId')||localStorage.getItem('facturador_emisor_id');const $=x=>document.getElementById(x);const tipoNombre=()=>tipos.find(t=>t[0]===tipo)?.[1]||tipo;function esc(s){return String(s??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','\\':'&#92;'}[c]))}async function jsonFetch(url,opt={}){const r=await fetch(url,{...opt,headers:{Accept:'application/json',...(opt.headers||{})}});const ct=r.headers.get('content-type')||'';if(!ct.includes('application/json')){const t=(await r.text()).slice(0,900);throw new Error(`Respuesta inesperada del servidor (${r.status}). ${t}`)}return {r,d:await r.json()}}function renderTabs(){
$('tabs').innerHTML=tipos.map(x=>'<button class="doc-tab '+(x[0]===tipo?'active':'')+'" data-t="'+x[0]+'">'+x[1]+'</button>').join('');document.querySelectorAll('.doc-tab').forEach(b=>b.onclick=()=>{const u=new URL(location.href);u.searchParams.set('tipo',b.dataset.t);location.href=u.toString()});$('titulo').textContent=tipoNombre();$('ayuda').textContent=tipo==='nota_credito'?'Anulación/corrección, devoluciones, descuentos o bonificaciones sobre una operación sustentada.':tipo==='nota_debito'?'Intereses de mora o recuperación posterior de costos y gastos.':tipo==='liquidacion_compra'?'Adquisiciones que cumplen las condiciones tributarias para liquidación de compra.':tipo==='guia_remision'?'Traslado de mercaderías con transportista, fechas, origen, destino y detalle.':'Retenciones efectuadas con documento de sustento y valores retenidos.';
$('reglas').innerHTML=tipo==='nota_credito'?'<div class="warning"><b>Control SRI:</b> una factura transmitida como CONSUMIDOR FINAL no puede modificarse mediante nota de crédito. Fuera de la ventana de anulación en línea, la nota de crédito debe emitirse dentro de los 12 meses de la factura sustentada.</div>':'<div class="ok">El sistema validará los campos mínimos del tipo de documento y el XML contra el esquema XSD antes de firmarlo y transmitirlo al SRI.</div>'}
const plantillas={
nota_credito:{fechaEmision:'08/09/2026',tipoIdentificacionComprador:'04',razonSocialComprador:'CLIENTE',identificacionComprador:'0999999999001',codDocModificado:'01',numDocModificado:'001-001-000000001',fechaEmisionDocSustento:'08/09/2026',totalSinImpuestos:0,valorModificacion:0,totalConImpuestos:[{codigo:'2',codigoPorcentaje:'4',baseImponible:0,valor:0}],motivo:'Devolución o corrección',detalles:[{codigoPrincipal:'ITEM',descripcion:'Detalle',cantidad:1,precioUnitario:0,descuento:0,precioTotalSinImpuesto:0,impuestos:[{codigo:'2',codigoPorcentaje:'4',tarifa:15,baseImponible:0,valor:0}]}]},
nota_debito:{fechaEmision:'08/09/2026',tipoIdentificacionComprador:'04',razonSocialComprador:'CLIENTE',identificacionComprador:'0999999999001',codDocModificado:'01',numDocModificado:'001-001-000000001',fechaEmisionDocSustento:'08/09/2026',totalSinImpuestos:0,impuestos:[{codigo:'2',codigoPorcentaje:'4',tarifa:15,baseImponible:0,valor:0}],valorTotal:0,motivos:[{razon:'Interés por mora',valor:0}]},
liquidacion_compra:{fechaEmision:'08/09/2026',tipoIdentificacionProveedor:'05',razonSocialProveedor:'PROVEEDOR',identificacionProveedor:'0900000000',totalSinImpuestos:0,totalDescuento:0,totalConImpuestos:[{codigo:'2',codigoPorcentaje:'0',baseImponible:0,valor:0}],importeTotal:0,pagos:[{formaPago:'01',total:0}],detalles:[{codigoPrincipal:'ITEM',descripcion:'Bien o servicio',cantidad:1,precioUnitario:0,descuento:0,precioTotalSinImpuesto:0,impuestos:[{codigo:'2',codigoPorcentaje:'0',tarifa:0,baseImponible:0,valor:0}]}]},
guia_remision:{fechaEmision:'08/09/2026',dirPartida:'Origen',razonSocialTransportista:'TRANSPORTISTA',tipoIdentificacionTransportista:'04',rucTransportista:'0999999999001',fechaIniTransporte:'08/09/2026',fechaFinTransporte:'08/09/2026',placa:'ABC-1234',destinatarios:[{identificacionDestinatario:'0999999999001',razonSocialDestinatario:'DESTINATARIO',dirDestinatario:'Destino',motivoTraslado:'Venta',detalles:[{codigoPrincipal:'ITEM',descripcion:'Mercadería',cantidad:1}]}]},
retencion:{fechaEmision:'08/09/2026',tipoIdentificacionSujetoRetenido:'04',razonSocialSujetoRetenido:'PROVEEDOR',identificacionSujetoRetenido:'0999999999001',periodoFiscal:'09/2026',docsSustento:[{codSustento:'01',codDocSustento:'01',numDocSustento:'001-001-000000001',fechaEmisionDocSustento:'08/09/2026',numAutDocSustento:'0000000000000000000000000000000000000000000000000',pagoLocExt:'01',totalSinImpuestos:0,importeTotal:0,impuestosDocSustento:[],retenciones:[],pagos:[{formaPago:'01',total:0}]}]}
};
async function cargar(){try{const {r,d}=await jsonFetch('/api/documentos?emisorId='+encodeURIComponent(emisorId)+'&tipo='+encodeURIComponent(tipo));if(!r.ok)throw new Error(d.error||'No se pudo consultar documentos.');$('lista').innerHTML=(d||[]).map(x=>'<tr><td>'+new Date(x.created_at).toLocaleString('es-EC')+'</td><td>'+esc(tipos.find(t=>t[0]===x.tipo)?.[1]||x.tipo)+'</td><td>'+esc(x.estado)+'</td><td>'+esc(x.datos?.identificacion||x.datos?.identificacionComprador||x.datos?.identificacionSujetoRetenido||x.datos?.identificacionProveedor||'—')+'</td><td>'+(x.estado==='borrador'||x.estado==='listo'||x.estado==='rechazado'||x.estado==='devuelto'?'<button class="doc-btn" onclick="emitir(\''+x.id+'\')">🚀 Emitir al SRI</button>':'—')+'</td></tr>').join('')||'<tr><td colspan="5">No hay documentos registrados.</td></tr>'}catch(e){$('msg').textContent='❌ '+e.message}}
$('consultar').onclick=async()=>{const v=$('identificacion').value.trim();if(!v)return;$('msg').textContent='Consultando…';try{const {r,d}=await jsonFetch('/clientes/consultar?tipo='+( /^\d{13}$/.test(v)?'04':'05')+'&identificacion='+encodeURIComponent(v));if(d.encontrado){$('razon').value=d.datos?.razonSocial||'';$('msg').textContent='✅ Datos encontrados automáticamente.'}else $('msg').textContent=d.mensaje||'No se encontraron datos.'}catch(e){$('msg').textContent='❌ '+e.message}};
$('plantilla').onclick=()=>{$('datos').value=JSON.stringify(plantillas[tipo],null,2);$('msg').textContent='📋 Plantilla cargada. Reemplaza los datos de ejemplo por los datos reales antes de emitir.'};
$('form').onsubmit=async e=>{e.preventDefault();let datos={};try{datos=$('datos').value.trim()?JSON.parse($('datos').value):{identificacion:$('identificacion').value,razonSocial:$('razon').value,email:$('email').value,sustento:$('sustento').value,motivo:$('detalle').value};}catch(err){$('msg').textContent='❌ El JSON de datos SRI no es válido.';return}datos.identificacion=datos.identificacion||$('identificacion').value;datos.razonSocial=datos.razonSocial||$('razon').value;try{const {r,d}=await jsonFetch('/api/documentos',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({emisorId,tipo,datos})});$('msg').textContent=r.ok?'✅ Borrador guardado.':'❌ '+(d.error||'Error');if(r.ok)cargar()}catch(e){$('msg').textContent='❌ '+e.message}};
async function emitir(id){if(!confirm('¿Transmitir este documento al SRI ahora? La emisión será fiscal y no debe repetirse.'))return;$('msg').textContent='Transmitiendo, validando XSD, firmando y consultando autorización…';try{const {r,d}=await jsonFetch('/api/documentos/'+id+'/emitir',{method:'POST'});$('msg').textContent=r.ok?'✅ '+(d.estado||'Documento autorizado'):'❌ '+(d.error||d.mensaje||'El SRI no autorizó el documento.');cargar()}catch(e){$('msg').textContent='❌ '+e.message}}
renderTabs();cargar();
</script></body></html>
