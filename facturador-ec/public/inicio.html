<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="/app.css?v=9.9.36">
<script src="/app-shell.js?v=9.9.36" defer></script>

<title>Inicio — CONTSERTRIB FACTURACIÓN</title>
<style>
*{box-sizing:border-box}.dashboard{max-width:1420px;margin:auto}.welcome{display:flex;justify-content:space-between;align-items:flex-end;gap:18px;margin-bottom:22px}.welcome h2{margin:0;font-size:1.55rem;color:#0f172a}.welcome p{margin:5px 0 0;color:#64748b}.date{font-size:.8rem;color:#64748b;background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:10px 13px}.kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:14px;margin-bottom:18px}.kpi{background:#fff;border:1px solid #e5e7eb;border-radius:16px;padding:17px;box-shadow:0 7px 24px rgba(15,23,42,.045);position:relative;overflow:hidden}.kpi:after{content:"";position:absolute;right:-25px;top:-30px;width:90px;height:90px;border-radius:50%;background:#eff6ff}.kpi .ico{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;margin-bottom:12px;font-size:18px;position:relative;z-index:1}.kpi .label{font-size:.75rem;font-weight:700;color:#64748b}.kpi .value{font-size:1.42rem;font-weight:850;color:#0f172a;margin-top:4px}.kpi .hint{font-size:.68rem;color:#94a3b8;margin-top:5px}.blue .ico{background:#dbeafe}.green .ico{background:#dcfce7}.orange .ico{background:#fef3c7}.red .ico{background:#fee2e2}.purple .ico{background:#ede9fe}.main-grid{display:grid;grid-template-columns:minmax(0,1.65fr) minmax(280px,.72fr);gap:18px}.card{background:#fff;border:1px solid #e5e7eb;border-radius:16px;box-shadow:0 7px 24px rgba(15,23,42,.045);padding:18px}.card-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:15px}.card-head h3{margin:0;font-size:.9rem;color:#0f172a}.card-head small{color:#64748b}.chart{height:250px;display:flex;align-items:flex-end;gap:14px;padding:18px 8px 28px;border-top:1px solid #f1f5f9}.bar-col{flex:1;height:100%;display:flex;align-items:flex-end;justify-content:center;position:relative}.bar{width:min(48px,75%);border-radius:8px 8px 3px 3px;background:linear-gradient(180deg,#3b82f6,#2563eb);min-height:8px;position:relative}.bar:hover{filter:brightness(1.06)}.bar em{position:absolute;top:-22px;left:50%;transform:translateX(-50%);font-style:normal;font-size:.62rem;color:#475569;white-space:nowrap}.bar-col span{position:absolute;bottom:-23px;font-size:.62rem;color:#64748b;white-space:nowrap}.two{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:18px}.quick{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.quick a{display:flex;align-items:center;gap:9px;padding:12px;border:1px solid #e5e7eb;border-radius:12px;text-decoration:none;color:#0f172a;font-size:.75rem;font-weight:800;background:#fff}.quick a:hover{border-color:#93c5fd;background:#eff6ff}.quick i{font-style:normal;width:32px;height:32px;border-radius:9px;display:grid;place-items:center;background:#eff6ff}.alerts{display:grid;gap:9px}.alert{display:flex;gap:10px;padding:11px;border-radius:11px;background:#f8fafc}.dot{width:9px;height:9px;border-radius:50%;margin-top:5px;background:#16a34a;flex:0 0 auto}.dot.red{background:#dc2626}.dot.orange{background:#d97706}.alert strong{display:block;font-size:.73rem}.alert small{display:block;color:#64748b;font-size:.65rem;margin-top:2px}.sales{margin-top:18px}.sales table{width:100%;border-collapse:collapse}.sales th,.sales td{padding:11px 8px;border-bottom:1px solid #eef2f7;text-align:left;font-size:.7rem}.sales th{color:#64748b;font-size:.64rem;text-transform:uppercase;letter-spacing:.03em}.status{display:inline-flex;padding:4px 8px;border-radius:999px;background:#dcfce7;color:#166534;font-weight:800;font-size:.61rem}.side-stack{display:grid;gap:18px}.system{display:grid;gap:9px}.sys{display:flex;justify-content:space-between;align-items:center;padding:9px 10px;background:#f8fafc;border-radius:10px;font-size:.7rem}.online{color:#16a34a;font-weight:800}.email-box{background:linear-gradient(135deg,#eff6ff,#f8fafc);border:1px solid #dbeafe}.email-box button{width:100%;border:0;border-radius:10px;background:#2563eb;color:#fff;font-weight:800;padding:11px;cursor:pointer}.email-box p{font-size:.7rem;color:#64748b;line-height:1.45}.empty{padding:25px;text-align:center;color:#94a3b8;font-size:.8rem}.error-panel{background:#fff;border:1px solid #fecaca;color:#991b1b;border-radius:14px;padding:18px}.env{display:inline-flex;padding:4px 8px;border-radius:999px;font-size:.62rem;font-weight:800;background:#dcfce7;color:#166534}.env.pruebas{background:#fef3c7;color:#92400e}@media(max-width:1100px){.kpis{grid-template-columns:repeat(3,1fr)}.main-grid{grid-template-columns:1fr}.side-stack{grid-template-columns:repeat(2,1fr)}}@media(max-width:720px){.welcome{align-items:flex-start;flex-direction:column}.kpis{grid-template-columns:repeat(2,1fr)}.two,.side-stack{grid-template-columns:1fr}.quick{grid-template-columns:1fr 1fr}.chart{gap:7px}}@media(max-width:460px){.kpis{grid-template-columns:1fr}.quick{grid-template-columns:1fr}}
</style>
</head>
<body>
<header><div class="logo">🧾</div><h1>CONTSERTRIB FACTURACIÓN</h1><div class="subtitulo">Sistema de Facturación Electrónica</div><div class="nav"></div></header>
<main class="contenedor"><div id="app" class="dashboard"><div class="empty">Cargando información del negocio…</div></div></main>
<script>
(async function(){
 const app=document.getElementById('app');
 const q=new URLSearchParams(location.search); let emisorId=q.get('emisorId')||localStorage.getItem('facturador_emisor_id');
 function money(n){return '$'+Number(n||0).toLocaleString('es-EC',{minimumFractionDigits:2,maximumFractionDigits:2});}
 function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));}
 try{
   const auth=await fetch('/auth/yo'); if(!auth.ok){location.href='/login';return;} const me=await auth.json();
   const negocios=me.negocios||[]; if(!emisorId) emisorId=negocios[0]?.emisorId;
   if(!emisorId){app.innerHTML='<div class="error-panel"><strong>Sin negocio asociado</strong><p>Tu usuario todavía no tiene un emisor configurado.</p></div>';return;}
   const negocio=negocios.find(n=>n.emisorId===emisorId)||negocios[0]; emisorId=negocio.emisorId; localStorage.setItem('facturador_emisor_id',emisorId);
   if(q.get('emisorId')!==emisorId){const u=new URL(location.href);u.searchParams.set('emisorId',emisorId);history.replaceState({},'',u.toString());}
   const r=await fetch('/dashboard/resumen?emisorId='+encodeURIComponent(emisorId)); const d=await r.json(); if(!r.ok) throw new Error(d.error||'No se pudo cargar el panel.');
   const ventas7=d.ventasUltimos7Dias||[]; const max=Math.max(...ventas7.map(x=>Number(x.total)||0),1);
   const ventasHtml=ventas7.map(x=>`<div class="bar-col"><div class="bar" style="height:${Math.max(5,(Number(x.total||0)/max)*82)}%"><em>${money(x.total)}</em></div><span>${esc(x.label)}</span></div>`).join('');
   const ventasRecientes=d.ventasRecientes||[];
   app.innerHTML=`
   <div class="welcome"><div><h2>Inicio</h2><p>Resumen general de <strong>${esc(d.emisor.nombreComercial||d.emisor.razonSocial)}</strong></p></div><div class="date">📅 ${new Date().toLocaleDateString('es-EC',{weekday:'long',day:'2-digit',month:'long',year:'numeric'})}</div></div>
   <div class="kpis">
    <div class="kpi blue"><div class="ico">🧾</div><div class="label">Facturas emitidas</div><div class="value">${d.facturasMes??0}</div><div class="hint">Este mes</div></div>
    <div class="kpi green"><div class="ico">🛒</div><div class="label">Ventas del mes</div><div class="value">${money(d.ventasMes)}</div><div class="hint">Acumulado autorizado</div></div>
    <div class="kpi orange"><div class="ico">📦</div><div class="label">Productos en stock</div><div class="value">${d.productosTotal??0}</div><div class="hint">Productos activos</div></div>
    <div class="kpi red"><div class="ico">⚠️</div><div class="label">Stock bajo</div><div class="value">${(d.productosStop||0)+(d.productosStockBajo||0)}</div><div class="hint">${d.productosStop||0} en STOP</div></div>
    <div class="kpi purple"><div class="ico">💰</div><div class="label">Caja actual</div><div class="value">${money(d.cajaActual)}</div><div class="hint">Saldo esperado</div></div>
   </div>
   <div class="main-grid">
    <section>
      <div class="card"><div class="card-head"><div><h3>📊 Ventas de los últimos 7 días</h3><small>Comprobantes autorizados</small></div><span class="env ${d.emisor.ambiente==='pruebas'?'pruebas':''}">${d.emisor.ambiente==='pruebas'?'PRUEBAS':'PRODUCCIÓN'}</span></div><div class="chart">${ventasHtml||'<div class="empty">Sin ventas registradas.</div>'}</div></div>
      <div class="card sales"><div class="card-head"><h3>🧾 Últimas ventas</h3><a href="/reportes?emisorId=${encodeURIComponent(emisorId)}" class="ec-export">Ver todas →</a></div><div style="overflow:auto"><table><thead><tr><th>N° Factura</th><th>Fecha</th><th>Cliente</th><th>Total</th><th>Estado</th><th>Acciones</th></tr></thead><tbody>${ventasRecientes.length?ventasRecientes.map(v=>`<tr><td><strong>${esc(v.secuencial||'—')}</strong></td><td>${esc(new Date(v.created_at).toLocaleString('es-EC',{timeZone:'America/Guayaquil'}))}</td><td>${esc(v.cliente||'Consumidor Final')}</td><td>${money(v.importe_total)}</td><td><span class="status">Autorizada</span></td><td><a href="/comprobantes/${encodeURIComponent(v.id)}/ride" target="_blank">PDF</a> · <a href="/comprobantes/${encodeURIComponent(v.id)}/xml" target="_blank">XML</a> · <button class="ec-action email" onclick="reenviarFactura('${esc(v.id)}','${esc(v.email||'')}')">✉</button></td></tr>`).join(''):'<tr><td colspan="6" class="empty">Todavía no hay ventas autorizadas.</td></tr>'}</tbody></table></div></div>
      <div class="card" style="margin-top:18px"><div class="card-head"><h3>⚡ Acciones rápidas</h3></div><div class="quick">
       <a href="/pos?emisorId=${encodeURIComponent(emisorId)}"><i>🧾</i>Nueva factura</a><a href="/proformas?emisorId=${encodeURIComponent(emisorId)}"><i>📝</i>Nueva proforma</a><a href="/productos-admin?emisorId=${encodeURIComponent(emisorId)}"><i>📦</i>Registrar producto</a><a href="/inventario?emisorId=${encodeURIComponent(emisorId)}"><i>📊</i>Ver inventario</a><a href="/reportes?emisorId=${encodeURIComponent(emisorId)}"><i>📈</i>Generar reporte</a><a href="/correo-prueba?emisorId=${encodeURIComponent(emisorId)}"><i>✉️</i>Enviar correo</a>
      </div></div>
    </section>
    <aside class="side-stack">
      <div class="card"><div class="card-head"><h3>🔔 Notificaciones</h3></div><div class="alerts"><div class="alert"><span class="dot red"></span><div><strong>${d.productosStop||0} productos en STOP</strong><small>Requieren atención inmediata</small></div></div><div class="alert"><span class="dot orange"></span><div><strong>${d.productosStockBajo||0} productos con stock bajo</strong><small>Revisar inventario</small></div></div><div class="alert"><span class="dot"></span><div><strong>${d.proformasVigentes||0} proformas vigentes</strong><small>Disponibles para facturar</small></div></div></div></div>
      <div class="card"><div class="card-head"><h3>✓ Estado del sistema</h3></div><div class="system"><div class="sys"><span>Conexión SRI</span><span class="online">Activa</span></div><div class="sys"><span>Base de datos</span><span class="online">Activa</span></div><div class="sys"><span>Servicio de correo</span><span class="online">Configurado</span></div><div class="sys"><span>Ambiente</span><strong>${esc(d.emisor.ambiente)}</strong></div></div></div>
      <div class="card email-box"><div class="card-head"><h3>✉️ Correo electrónico</h3></div><p>Prueba el servicio de correo configurado en Railway antes de reenviar facturas a tus clientes.</p><a href="/correo-prueba?emisorId=${encodeURIComponent(emisorId)}"><button>Enviar prueba</button></a></div>
    </aside>
   </div>`;
   document.title=(d.emisor.nombreComercial||d.emisor.razonSocial)+' — CONTSERTRIB FACTURACIÓN';
   window._facturadorEmisorId=emisorId;
 }catch(e){app.innerHTML='<div class="error-panel"><strong>No se pudo cargar el panel</strong><p>'+esc(e.message)+'</p><button onclick="location.reload()">Reintentar</button></div>';}
 window.reenviarFactura=async function(id,email){const destino=prompt('Correo del cliente:',email||'');if(!destino)return;if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(destino))return alert('Ingresa un correo válido.');try{const r=await fetch('/comprobantes/'+encodeURIComponent(id)+'/reenviar-email',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:destino,emisorId:window._facturadorEmisorId})});const x=await r.json();if(!r.ok)throw new Error(x.error+(x.detalle?' — '+x.detalle:''));alert('✓ '+x.mensaje+'\n'+x.destinatario);}catch(e){alert('No se pudo reenviar: '+e.message);}};
})();
</script>
</body></html>
