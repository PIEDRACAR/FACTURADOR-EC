<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="/app.css?v=9.9.13">
<script src="/app-shell.js?v=9.9.13" defer></script>
<title>Caja</title><style>body{font-family:system-ui;margin:0;background:#f1f5f9;color:#0f172a}.wrap{max-width:760px;margin:auto;padding:16px}.card{background:#fff;border:1px solid #e2e8f0;border-radius:16px;padding:18px;margin-bottom:14px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.k{background:#f8fafc;padding:14px;border-radius:12px}.v{font-size:1.35rem;font-weight:800}input,button,textarea{width:100%;padding:11px;border-radius:9px;border:1px solid #cbd5e1;box-sizing:border-box;margin-top:6px}button{background:#1d4ed8;color:white;font-weight:700}.danger{background:#dc2626}.ok{background:#059669}.mut{color:#64748b;font-size:.85rem}.row{display:flex;gap:8px}.row>*{flex:1}table{width:100%;border-collapse:collapse}td,th{padding:8px;border-bottom:1px solid #e2e8f0;text-align:left;font-size:.85rem}</style></head><body><div class="wrap contenedor"><div class="card"><h2>💵 Administración de caja</h2><p id="estado" class="mut">Cargando…</p><div class="grid"><div class="k"><div class="v" id="ingresos">$0.00</div>Ingresos</div><div class="k"><div class="v" id="efectivo">$0.00</div>Efectivo esperado</div><div class="k"><div class="v" id="egresos">$0.00</div>Egresos</div><div class="k"><div class="v" id="tarjetas">$0.00</div>Otros medios</div></div></div><div class="card" id="abrir"><h3>Abrir caja</h3><label>Monto inicial</label><input id="inicial" type="number" step="0.01" value="0"><button class="ok" onclick="abrirCaja()">Abrir caja</button></div><div class="card"><h3>Movimiento manual</h3><div class="row"><select id="tipo"><option value="ingreso">Ingreso</option><option value="egreso">Egreso</option></select><select id="forma"><option value="01">Efectivo</option><option value="19">Tarjeta</option><option value="20">Transferencia</option></select></div><input id="concepto" placeholder="Concepto"><input id="monto" type="number" step="0.01" placeholder="Monto"><button onclick="movimiento()">Registrar movimiento</button></div><div class="card"><h3>Cerrar caja / arqueo</h3><input id="declarado" type="number" step="0.01" placeholder="Efectivo contado físicamente"><button class="danger" onclick="cerrarCaja()">Cerrar caja</button><p id="cierre" class="mut"></p></div><div class="card"><div class="row"><button type="button" onclick="tabCaja('actual')">Caja actual</button><button type="button" onclick="tabCaja('equipo')">Cajas del equipo</button><button type="button" onclick="tabCaja('historial')">Historial</button></div><div id="panel-actual"><h3>Movimientos</h3><div id="lista">—</div></div><div id="panel-historial" style="display:none"><h3>Historial de cajas</h3><div id="historial">Cargando…</div></div></div><div class="card"><a id="inicio" href="">🏠 Inicio</a> · <a id="pos" href="">🛒 POS</a> · <a id="inventario" href="">📦 Inventario</a></div></div><script>const emisorId=new URLSearchParams(location.search).get('emisorId')||localStorage.getItem('facturador_emisor_id')||window.__FACTURADOR_EMISOR_ID__||'';let caja=null;const $=id=>document.getElementById(id);$('inicio').href='/?emisorId='+encodeURIComponent(emisorId||'');$('pos').href='/pos?emisorId='+encodeURIComponent(emisorId||'');$('inventario').href='/inventario?emisorId='+encodeURIComponent(emisorId||'');async function cargar(){const r=await fetch('/caja/actual?emisorId='+encodeURIComponent(emisorId));const d=await r.json();caja=d.caja||null;$('abrir').style.display=d.abierta?'none':'block';$('estado').textContent=d.abierta?'🟢 Caja abierta desde '+new Date(caja.fecha_apertura).toLocaleString():'🔴 No hay caja abierta';$('ingresos').textContent='$'+Number(d.ingresos||0).toFixed(2);$('efectivo').textContent='$'+Number(d.efectivoEsperado||0).toFixed(2);$('egresos').textContent='$'+Number(d.egresos||0).toFixed(2);$('tarjetas').textContent='$'+(Number(d.totalTarjetas||0)+Number(d.totalTransferencias||0)).toFixed(2);$('lista').innerHTML=(d.movimientos||[]).map(m=>`<div>${m.tipo==='ingreso'?'🟢':'🔴'} ${m.concepto} — $${Number(m.monto).toFixed(2)}</div>`).join('')||'Sin movimientos'; const h=await fetch('/caja/historial?emisorId='+encodeURIComponent(emisorId)); const hs=await h.json(); $('historial').innerHTML=(hs||[]).map(x=>`<div style=\"padding:8px 0;border-bottom:1px solid #e2e8f0\">${x.estado==='abierta'?'🟢':'⚪'} ${new Date(x.fecha_apertura).toLocaleString()} — $${Number(x.monto_inicial).toFixed(2)} — ${x.estado} ${x.diferencia==null?'':' — diferencia $'+Number(x.diferencia).toFixed(2)}</div>`).join('')||'Sin historial';}async function abrirCaja(){const r=await fetch('/caja/abrir',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({emisorId,montoInicial:Number($('inicial').value)})});const d=await r.json();if(!r.ok)return alert(d.error);cargar()}async function movimiento(){if(!caja)return alert('Primero abre la caja.');const r=await fetch('/caja/movimiento',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({cajaId:caja.id,tipo:$('tipo').value,formaPago:$('forma').value,concepto:$('concepto').value,monto:Number($('monto').value)})});const d=await r.json();if(!r.ok)return alert(d.error);$('concepto').value='';$('monto').value='';cargar()}async function cerrarCaja(){if(!caja)return alert('No hay caja abierta.');const r=await fetch('/caja/cerrar',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({cajaId:caja.id,efectivoDeclarado:Number($('declarado').value)})});const d=await r.json();if(!r.ok)return alert(d.error);$('cierre').textContent=`Cierre realizado. Efectivo esperado: $${Number(d.efectivo_esperado).toFixed(2)} — Diferencia: $${Number(d.diferencia).toFixed(2)}`;cargar()}function tabCaja(t){$('panel-actual').style.display=t==='actual'||t==='equipo'?'block':'none';$('panel-historial').style.display=t==='historial'?'block':'none';if(t==='equipo'){$('panel-actual').innerHTML='<h3>Cajas del equipo</h3><p class=\"mut\">Aquí se muestran las cajas abiertas/cerradas del negocio. Para separar por usuario, asocia usuario_id en tu esquema de usuarios.</p>'+$('lista').outerHTML;}}cargar();</script></body></html>
