<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="/app.css?v=9.9.4"><script src="/app-shell.js?v=9.9.4" defer></script><title>CONTSERTRIB · Impuestos</title><style>body{background:#f6f8fb}.wrap{max-width:1100px;margin:auto;padding:22px}.card{background:#fff;border:1px solid #e5e7eb;border-radius:16px;padding:18px;margin-bottom:16px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.rate{border:1px solid #dbe3ef;border-radius:14px;padding:16px}.rate strong{font-size:28px}.muted{color:#64748b;font-size:13px}.select{width:100%;padding:10px;border:1px solid #cbd5e1;border-radius:9px}@media(max-width:800px){.grid{grid-template-columns:1fr}}</style></head><body><main class="wrap"><div class="card"><h1>⚖️ Motor tributario</h1><p class="muted">Las tarifas se consultan por contribuyente. Los comprobantes históricos conservan la tarifa con la que fueron emitidos.</p><label>Negocio / RUC<select id="negocio" class="select"></select></label><div id="msg" class="muted" style="margin-top:10px"></div></div><div id="contenido"></div></main><script>const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function api(u){const r=await fetch(u,{credentials:'same-origin'});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||'No se pudo consultar la información.');return d;}async function init(){try{const d=await api('/auth/yo');const arr=d.negocios||[];$('negocio').innerHTML=arr.map(x=>`<option value="${esc(x.emisorId)}">${esc(x.razonSocial||'Negocio')} · ${esc('')}</option>`).join('');if(!arr.length){$('msg').textContent='No hay negocios asociados a este usuario.';return;}const q=new URLSearchParams(location.search);const selected=q.get('emisorId')||arr[0].emisorId;$('negocio').value=selected;await cargar(selected);$('negocio').onchange=()=>{const id=$('negocio').value;history.replaceState(null,'','/impuestos?emisorId='+encodeURIComponent(id));cargar(id)};}catch(e){$('msg').textContent=e.message}}async function cargar(id){$('msg').textContent='Consultando configuración…';try{const d=await api('/impuestos/configuracion?emisorId='+encodeURIComponent(id));$('contenido').innerHTML=`<div class="card"><h2>Configuración efectiva</h2><div class="grid"><div class="rate"><div class="muted">IVA general</div><strong>${Number(d.tarifa_general??15).toFixed(2)}%</strong><div class="muted">Código SRI: ${esc(d.codigo_general||'4')}</div></div><div class="rate"><div class="muted">IVA reducido</div><strong>${Number(d.tarifa_reducida??5).toFixed(2)}%</strong><div class="muted">Código SRI: ${esc(d.codigo_reducida||'5')}</div></div><div class="rate"><div class="muted">IVA turismo</div><strong>${Number(d.tarifa_turismo??8).toFixed(2)}%</strong><div class="muted">Código SRI: ${esc(d.codigo_turismo||'8')}</div></div></div><p class="muted" style="margin-top:14px">Esta pantalla es informativa para el cliente. Los cambios oficiales de tarifas deben ser gestionados por el administrador del servicio y quedar con fecha de vigencia.</p></div>`;$('msg').textContent='';}catch(e){$('msg').textContent=e.message;$('contenido').innerHTML=''}}init();</script></body></html>
