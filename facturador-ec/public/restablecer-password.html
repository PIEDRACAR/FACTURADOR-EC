<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Restablecer acceso — CONTSERTRIB</title><style>body{font-family:Arial,sans-serif;background:#f6f8fb;margin:0;padding:32px 16px;color:#172033}.box{max-width:480px;margin:auto;background:#fff;border:1px solid #e5e7eb;border-radius:18px;padding:24px;box-shadow:0 8px 30px #0f172a12}label{display:block;font-weight:700;margin:14px 0 5px}input,button{width:100%;box-sizing:border-box;padding:12px;border-radius:9px;font-size:15px}input{border:1px solid #cbd5e1}button{margin-top:18px;border:0;background:#0f2747;color:#fff;font-weight:800}.msg{margin-top:14px}</style></head><body><main class="box"><h1>Restablecer contraseña</h1><p>Define una nueva contraseña usando el enlace seguro enviado por Supabase.</p><form id="f"><label>Nueva contraseña</label><input id="password" type="password" minlength="8" required><label>Confirmar contraseña</label><input id="confirm" type="password" minlength="8" required><button>Guardar contraseña</button><div id="msg" class="msg"></div></form></main><script>const params=new URLSearchParams(location.hash.slice(1));const token=params.get('access_token')||'';const msg=document.getElementById('msg');if(!token)msg.textContent='El enlace no contiene una sesión de recuperación válida.';document.getElementById('f').addEventListener('submit',async e=>{e.preventDefault();const password=document.getElementById('password').value;if(password!==document.getElementById('confirm').value){msg.textContent='Las contraseñas no coinciden.';return}try{const r=await fetch('/auth/actualizar-password-recuperacion',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({accessToken:token,password})});const d=await r.json();if(!r.ok)throw Error(d.error||'No se pudo actualizar.');history.replaceState(null,'',location.pathname);msg.textContent='Contraseña actualizada. Ya puedes iniciar sesión.';setTimeout(()=>location.href='/login',1200)}catch(x){msg.textContent=x.message}});</script></body></html>
