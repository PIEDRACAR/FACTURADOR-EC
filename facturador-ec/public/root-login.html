<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Acceso ROOT — CONTSERTRIB FACTURACIÓN</title>
<style>
:root{--azul:#1d4ed8;--osc:#172554;--borde:#e2e8f0;--gris:#64748b;--rojo:#dc2626;--rojof:#fee2e2}
*{box-sizing:border-box}body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:linear-gradient(135deg,#020617,#1e3a8a)}
.card{width:100%;max-width:390px;background:#fff;border-radius:18px;padding:32px 28px;box-shadow:0 20px 60px rgba(0,0,0,.28)}
.logo{text-align:center;font-size:2.2rem;margin-bottom:8px}h1{text-align:center;font-size:1.18rem;margin:0;color:#0f172a}.sub{text-align:center;color:var(--gris);font-size:.84rem;margin:7px 0 24px}
.badge{display:block;text-align:center;background:#eff6ff;color:#1e3a8a;border:1px solid #bfdbfe;border-radius:999px;padding:7px 10px;font-size:.75rem;font-weight:800;margin-bottom:22px}
label{display:block;font-size:.78rem;font-weight:700;color:#475569;margin:14px 0 6px}
input{width:100%;padding:12px 13px;border:1px solid var(--borde);border-radius:10px;font-size:.95rem}
input[readonly]{background:#f8fafc;color:#334155}
button{width:100%;border:0;border-radius:10px;background:var(--azul);color:#fff;padding:13px;margin-top:20px;font-weight:800;cursor:pointer}
button:disabled{opacity:.65;cursor:not-allowed}
.msg{display:none;margin-top:14px;padding:11px 13px;border-radius:9px;font-size:.83rem}.msg.error{display:block;background:var(--rojof);color:#991b1b}
.volver{display:block;text-align:center;margin-top:18px;color:var(--azul);text-decoration:none;font-size:.82rem;font-weight:700}
small{display:block;color:#94a3b8;margin-top:7px;font-size:.72rem;line-height:1.35}
</style>
</head>
<body>
<div class="card">
  <div class="logo">🔐</div>
  <h1>Panel Maestro</h1>
  <p class="sub">CONTSERTRIB FACTURACIÓN</p>
  <div class="badge">ACCESO EXCLUSIVO · ROOT</div>
  <form id="form">
    <label>Usuario ROOT</label>
    <input id="email" type="email" value="ecfacturador@gmail.com" readonly autocomplete="username">
    <label>Clave ROOT</label>
    <input id="password" type="password" required autocomplete="current-password" placeholder="Ingrese su clave ROOT">
    <small>La clave se valida mediante Supabase Auth y no se guarda en esta página ni en el código fuente.</small>
    <button id="btn" type="submit">Entrar al Panel Maestro</button>
    <div id="msg" class="msg"></div>
  </form>
  <a class="volver" href="/login">← Volver al acceso normal</a>
</div>
<script>
document.getElementById('form').addEventListener('submit',async e=>{
 e.preventDefault();
 const btn=document.getElementById('btn'),msg=document.getElementById('msg');
 msg.className='msg'; msg.textContent=''; btn.disabled=true; btn.textContent='Verificando…';
 try{
  const r=await fetch('/auth/root-login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({
   email:document.getElementById('email').value,password:document.getElementById('password').value
  })});
  const d=await r.json();
  if(!r.ok) throw new Error(d.error||'No se pudo iniciar sesión.');
  window.location.href='/admin-proveedor';
 }catch(err){msg.className='msg error';msg.textContent=err.message}
 finally{btn.disabled=false;btn.textContent='Entrar al Panel Maestro'}
});
</script>
</body>
</html>
