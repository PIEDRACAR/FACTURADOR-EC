<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Contabilidad · CONTSERTRIB</title><link rel="stylesheet" href="/app.css?v=9.9.4"><script src="/app-shell.js?v=9.9.4" defer></script><style>
body{background:#f5f7fb}.ct-wrap{max-width:1500px;margin:0 auto;padding:24px}.ct-head{display:flex;justify-content:space-between;gap:16px;align-items:center;margin-bottom:20px}.ct-head h1{margin:0;font-size:28px}.ct-head p{margin:5px 0;color:#64748b}.ct-actions{display:flex;gap:8px;flex-wrap:wrap}.ct-btn{border:1px solid #dbe3ef;background:#fff;border-radius:10px;padding:10px 14px;cursor:pointer;font-weight:700}.ct-btn.primary{background:#0f172a;color:#fff;border-color:#0f172a}.ct-kpis{display:grid;grid-template-columns:repeat(6,minmax(130px,1fr));gap:12px;margin-bottom:18px}.ct-card{background:#fff;border:1px solid #e5eaf2;border-radius:16px;padding:16px;box-shadow:0 8px 25px rgba(15,23,42,.05)}.ct-card small{color:#64748b}.ct-card strong{display:block;font-size:23px;margin-top:7px}.ct-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.ct-table{width:100%;border-collapse:collapse}.ct-table th,.ct-table td{padding:10px;border-bottom:1px solid #eef2f7;text-align:left}.ct-table th{font-size:12px;color:#64748b}.ct-num{text-align:right!important}.ct-tabs{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}.ct-tab{padding:9px 13px;border-radius:10px;border:1px solid #dbe3ef;background:#fff;cursor:pointer}.ct-tab.active{background:#e8eef8;font-weight:800}.ct-status{margin:10px 0;padding:10px;border-radius:10px;background:#f1f5f9;color:#475569}.ct-danger{color:#b91c1c}.ct-ok{color:#166534}@media(max-width:900px){.ct-kpis{grid-template-columns:repeat(2,1fr)}.ct-grid{grid-template-columns:1fr}.ct-wrap{padding:14px}.ct-head{align-items:flex-start;flex-direction:column}}
</style></head><body><main class="ct-wrap"><div class="ct-head"><div><h1>Contabilidad automática</h1><p>Diario, plan de cuentas, balanza y trazabilidad documental.</p></div><div class="ct-actions"><button class="ct-btn" onclick="cargar()">↻ Actualizar</button><button class="ct-btn primary" onclick="location.href='/pos?emisorId='+encodeURIComponent(emisor())">＋ Nueva venta</button></div></div><div id="status" class="ct-status">Inicializando motor contable…</div><section class="ct-kpis"><div class="ct-card"><small>Activos</small><strong id="activos">$0.00</strong></div><div class="ct-card"><small>Pasivos</small><strong id="pasivos">$0.00</strong></div><div class="ct-card"><small>Patrimonio</small><strong id="patrimonio">$0.00</strong></div><div class="ct-card"><small>Ingresos</small><strong id="ingresos">$0.00</strong></div><div class="ct-card"><small>Gastos</small><strong id="gastos">$0.00</strong></div><div class="ct-card"><small>Resultado</small><strong id="resultado">$0.00</strong></div></section><div class="ct-tabs"><button class="ct-tab active" data-tab="balanza">Balanza</button><button class="ct-tab" data-tab="diario">Libro Diario</button><button class="ct-tab" data-tab="plan">Plan de Cuentas</button></div><section id="balanza" class="ct-card"><table class="ct-table"><thead><tr><th>Código</th><th>Cuenta</th><th class="ct-num">Debe</th><th class="ct-num">Haber</th><th class="ct-num">Saldo</th></tr></thead><tbody id="balBody"></tbody></table></section><section id="diario" class="ct-card" hidden><table class="ct-table"><thead><tr><th>Fecha</th><th>Tipo</th><th>Concepto</th><th class="ct-num">Debe</th><th class="ct-num">Haber</th></tr></thead><tbody id="diaBody"></tbody></table></section><section id="plan" class="ct-card" hidden><table class="ct-table"><thead><tr><th>Código</th><th>Cuenta</th><th>Tipo</th><th>Naturaleza</th></tr></thead><tbody id="planBody"></tbody></table></section></main><script>
const qs=new URLSearchParams(location.search);function emisor(){return qs.get('emisorId')||localStorage.getItem('facturador_emisor_id')||''}function money(n){return new Intl.NumberFormat('es-EC',{style:'currency',currency:'USD'}).format(Number(n||0))}function set(id,v){document.getElementById(id).textContent=money(v)}async function api(url){const r=await fetch(url,{credentials:'same-origin'});const d=await r.json();if(!r.ok)throw new Error(d.error||'Error');return d}async function cargar(){const id=emisor();if(!id){document.getElementById('status').textContent='Seleccione un negocio para cargar la contabilidad.';return}try{const [r,d,p]=await Promise.all([api('/contabilidad/resumen?emisorId='+encodeURIComponent(id)),api('/contabilidad/diario?emisorId='+encodeURIComponent(id)),api('/contabilidad/plan?emisorId='+encodeURIComponent(id))]);set('activos',r.activos);set('pasivos',r.pasivos);set('patrimonio',r.patrimonio);set('ingresos',r.ingresos);set('gastos',r.gastos);set('resultado',r.resultado);document.getElementById('status').innerHTML=r.asientosDescuadrados?'⚠️ Existen asientos descuadrados. <b>Revise antes del cierre.</b>':'<span class="ct-ok">✓ Libro contable cuadrado.</span>';document.getElementById('balBody').innerHTML=(r.cuentas||[]).map(x=>`<tr><td>${x.codigo}</td><td>${x.nombre}</td><td class="ct-num">${money(x.debe)}</td><td class="ct-num">${money(x.haber)}</td><td class="ct-num">${money(x.saldo)}</td></tr>`).join('');document.getElementById('diaBody').innerHTML=(d.asientos||[]).map(x=>`<tr><td>${x.fecha}</td><td>${x.tipo}</td><td>${x.concepto}</td><td class="ct-num">${money(x.total_debe)}</td><td class="ct-num">${money(x.total_haber)}</td></tr>`).join('');document.getElementById('planBody').innerHTML=(p.cuentas||[]).map(x=>`<tr><td>${x.codigo}</td><td>${x.nombre}</td><td>${x.tipo}</td><td>${x.naturaleza}</td></tr>`).join('');}catch(e){document.getElementById('status').textContent='No se pudo cargar la contabilidad: '+e.message;document.getElementById('status').classList.add('ct-danger')}}document.querySelectorAll('.ct-tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.ct-tab').forEach(x=>x.classList.remove('active'));document.querySelectorAll('section.ct-card').forEach(x=>x.hidden=true);b.classList.add('active');document.getElementById(b.dataset.tab).hidden=false});window.addEventListener('contsertrib:shell-ready',cargar);window.addEventListener('load',()=>setTimeout(cargar,350));
</script></body></html>
