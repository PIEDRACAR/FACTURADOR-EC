<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Iniciar sesión — CONTSERTRIB FACTURACIÓN</title>
<style>
  :root {
    --azul: #1d4ed8; --azul-osc: #1e3a8a; --gris-borde: #e2e8f0; --gris-fondo: #f8fafc;
    --gris-texto: #64748b; --rojo: #dc2626; --rojo-fondo: #fee2e2; --verde-fondo: #dcfce7; --verde: #166534;
  }
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: linear-gradient(135deg, var(--azul-osc), var(--azul));
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px;
  }
  .tarjeta {
    background: white; border-radius: 18px; padding: 32px 26px; max-width: 380px; width: 100%;
    box-shadow: 0 10px 40px rgba(0,0,0,0.2);
  }
  .logo { font-size: 2.4rem; text-align: center; margin-bottom: 6px; }
  h1 { font-size: 1.15rem; text-align: center; margin: 0 0 4px; color: #1e293b; }
  p.subtitulo { text-align: center; color: var(--gris-texto); font-size: 0.85rem; margin: 0 0 24px; }
  label { display: block; font-size: 0.8rem; font-weight: 600; color: var(--gris-texto); margin-top: 14px; margin-bottom: 5px; }
  label:first-of-type { margin-top: 0; }
  input {
    width: 100%; padding: 12px 14px; border: 1px solid var(--gris-borde); border-radius: 10px; font-size: 0.95rem;
  }
  button {
    width: 100%; background: var(--azul); color: white; border: none; padding: 14px;
    border-radius: 10px; font-size: 0.95rem; font-weight: 700; margin-top: 20px; cursor: pointer;
  }
  button:disabled { background: #93c5fd; cursor: not-allowed; }
  .mensaje { border-radius: 9px; padding: 11px 13px; margin-top: 14px; font-size: 0.85rem; display: none; }
  .mensaje.error { background: var(--rojo-fondo); color: #991b1b; display: block; }
  .enlace-registro { display: block; text-align: center; margin-top: 20px; color: var(--azul); font-weight: 600; text-decoration: none; font-size: 0.85rem; }

  .selector-negocios { display: none; margin-top: 18px; }
  .selector-negocios.visible { display: block; }
  .opcion-negocio {
    display: block; width: 100%; text-align: left; padding: 12px 14px; border: 1px solid var(--gris-borde);
    border-radius: 10px; margin-top: 8px; background: var(--gris-fondo); cursor: pointer; font-size: 0.9rem;
  }
  .opcion-negocio .rol { font-size: 0.72rem; color: var(--gris-texto); text-transform: uppercase; }
</style>
</head>
<body>
<div class="tarjeta">
  <div class="logo">🧾</div>
  <h1>CONTSERTRIB FACTURACIÓN</h1>
  <p class="subtitulo">Inicia sesión para continuar</p>

  <form id="form-login">
    <label>Correo</label>
    <input type="email" id="email" autocomplete="username" placeholder="tucorreo@ejemplo.com">
    <label>Contraseña</label>
    <input type="password" id="password" autocomplete="current-password">
    <button type="submit" id="btn-entrar">Iniciar sesión</button>
    <div class="mensaje" id="mensaje"></div>
  </form>

  <div class="selector-negocios" id="selector-negocios">
    <label style="margin-top:18px;">Elige el negocio</label>
    <div id="lista-negocios"></div>
  </div>

  <a class="enlace-registro" href="/registro">¿Todavía no tienes un negocio registrado? Regístrate aquí →</a>
</div>

<script>
document.getElementById('form-login').addEventListener('submit', async (e) => {
  e.preventDefault();
  const boton = document.getElementById('btn-entrar');
  const mensaje = document.getElementById('mensaje');
  mensaje.className = 'mensaje';

  boton.disabled = true;
  boton.textContent = 'Entrando…';
  try {
    const resp = await fetch('/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        email: document.getElementById('email').value.trim(),
        password: document.getElementById('password').value,
      }),
    });
    const datos = await resp.json();
    if (!resp.ok) throw new Error(datos.error || 'No se pudo iniciar sesión.');

    if (!datos.negocios || datos.negocios.length === 0) {
      mensaje.className = 'mensaje error';
      mensaje.textContent = 'Tu cuenta no tiene ningún negocio asociado todavía.';
      return;
    }

    if (datos.negocios.length === 1) {
      localStorage.setItem('facturador_emisor_id', datos.negocios[0].emisorId);
      window.location.href = '/?emisorId=' + encodeURIComponent(datos.negocios[0].emisorId);
      return;
    }

    // Varios negocios — mostrar selector.
    document.getElementById('form-login').style.display = 'none';
    const selector = document.getElementById('selector-negocios');
    selector.classList.add('visible');
    document.getElementById('lista-negocios').innerHTML = datos.negocios.map((n) => `
      <button type="button" class="opcion-negocio" data-id="${n.emisorId}">
        ${n.nombreComercial || n.razonSocial}<br><span class="rol">${n.rol}</span>
      </button>
    `).join('');
    document.querySelectorAll('.opcion-negocio').forEach((btn) => {
      btn.addEventListener('click', () => {
        localStorage.setItem('facturador_emisor_id', btn.dataset.id);
        window.location.href = '/?emisorId=' + encodeURIComponent(btn.dataset.id);
      });
    });
  } catch (err) {
    mensaje.className = 'mensaje error';
    mensaje.textContent = err.message;
  } finally {
    boton.disabled = false;
    boton.textContent = 'Iniciar sesión';
  }
});
</script>
</body>
</html>
