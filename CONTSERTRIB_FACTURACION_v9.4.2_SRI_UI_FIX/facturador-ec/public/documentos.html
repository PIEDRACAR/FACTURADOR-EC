<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Comprobantes · CONTSERTRIB FACTURACIÓN</title><style>
.doc-tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}.doc-tab{padding:10px 13px;border:1px solid #dbe3ee;border-radius:10px;background:#fff;font-weight:700;cursor:pointer}.doc-tab.active{background:#0f2747;color:#fff}.doc-panel{background:#fff;border:1px solid #e5e7eb;border-radius:16px;padding:20px}.doc-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.doc-grid label{font-size:12px;font-weight:700;color:#334155}.doc-grid input,.doc-grid select,.doc-grid textarea{width:100%;box-sizing:border-box;padding:11px;border:1px solid #cbd5e1;border-radius:9px;margin-top:5px}.doc-grid .full{grid-column:1/-1}.doc-actions{margin-top:16px;display:flex;gap:8px}.doc-btn{border:0;border-radius:9px;padding:11px 15px;font-weight:700;background:#0f2747;color:#fff}.doc-table{width:100%;border-collapse:collapse;margin-top:20px}.doc-table th,.doc-table td{padding:10px;border-bottom:1px solid #e5e7eb;text-align:left;font-size:12px}.muted{color:#64748b;font-size:13px}@media(max-width:700px){.doc-grid{grid-template-columns:1fr}.doc-grid .full{grid-column:auto}}
</style></head><body><main class="contenedor"><div class="doc-tabs" id="tabs"></div><section class="doc-panel"><h2 id="titulo"></h2><p class="muted" id="ayuda"></p><form id="form" class="doc-grid"><label>Identificación<input id="identificacion" placeholder="Cédula / RUC"></label><label>Razón social / nombres<input id="razon" placeholder="Se completará al consultar"></label><label>Correo electrónico<input id="email" type="email"></label><label>Documento sustento<input id="sustento" placeholder="Número de factura relacionada"></label><label class="full">Detalle / motivo<textarea id="detalle" rows="4"></textarea></label><label class="full">Datos SRI (JSON técnico)<textarea id="datos" rows="8" placeholder="Pegue aquí el objeto JSON específico del comprobante. Ej.: {&quot;fechaEmision&quot;:&quot;08/09/2026&quot;,...}"></textarea></label><div class="doc-actions full"><button type="button" class="doc-btn" id="consultar">🔎 Consultar identificación</button><button class="doc-btn">💾 Guardar borrador</button></div></form><div id="msg" class="muted"></div><table class="doc-table"><thead><tr><th>Fecha</th><th>Tipo</th><th>Estado</th><th>Identificación</th><th>Acción</th></tr></thead><tbody id="lista"></tbody></table></section></main><script>
const tipos=[['nota_credito','Nota de crédito'],['nota_debito','Nota de débito'],['liquidacion_compra','Liquidación de compra'],['guia_remision','Guía de remisión'],['retencion','Comprobante de retención']];const p=new URLSearchParams(location.search);let tipo=p.get('tipo')||'nota_credito',emisorId=p.get('emisorId')||localStorage.getItem('facturador_emisor_id');const $=x=>document.getElementById(x);function esc(s){return String(s??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','\\':'&#92;'}[c]))}function renderTabs(){$('tabs').innerHTML=tipos.map(x=>'<button class="doc-tab '+(x[0]===tipo?'active':'')+'" data-t="'+x[0]+'">'+x[1]+'</button>').join('');document.querySelectorAll('.doc-tab').forEach(b=>b.onclick=()=>{const u=new URL(location.href);u.searchParams.set('tipo',b.dataset.t);location.href=u.toString()});const n=tipos.find(x=>x[0]===tipo);$('titulo').textContent=n[1];$('ayuda').textContent=tipo==='nota_credito'?'Correcciones, devoluciones, descuentos o bonificaciones.':tipo==='nota_debito'?'Aumentos posteriores de la operación sustentada.':tipo==='liquidacion_compra'?'Documento para adquisiciones que cumplan las condiciones tributarias aplicables.':tipo==='guia_remision'?'Traslado de bienes con origen, destino, transportista y motivos.':'Documento de retención asociado al comprobante sustentado.'}async function cargar(){const r=await fetch('/api/documentos?emisorId='+encodeURIComponent(emisorId)+'&tipo='+encodeURIComponent(tipo));const d=await r.json();$('lista').innerHTML=(d||[]).map(x=>'<tr><td>'+new Date(x.created_at).toLocaleString('es-EC')+'</td><td>'+esc(tipos.find(t=>t[0]===x.tipo)?.[1]||x.tipo)+'</td><td>'+esc(x.estado)+'</td><td>'+esc(x.datos?.identificacion||x.datos?.identificacionComprador||x.datos?.identificacionSujetoRetenido||x.datos?.identificacionProveedor||'—')+'</td><td>'+(x.estado==='borrador'||x.estado==='listo'?'<button class="doc-btn" onclick="emitir(\''+x.id+'\')">🚀 Emitir al SRI</button>':'—')+'</td></tr>').join('')||'<tr><td colspan="5">No hay documentos registrados.</td></tr>'}$('consultar').onclick=async()=>{const v=$('identificacion').value.trim();if(!v)return;const t=/^\d{13}$/.test(v)?'04':'05';const r=await fetch('/clientes/consultar?tipo='+t+'&identificacion='+encodeURIComponent(v));const d=await r.json();if(d.encontrado){$('razon').value=d.datos?.razonSocial||'';$('msg').textContent='✅ Datos encontrados automáticamente.'}else $('msg').textContent=d.mensaje||'No se encontraron datos.'};$('form').onsubmit=async e=>{e.preventDefault();let datos;try{datos=$('datos').value.trim()?JSON.parse($('datos').value):{identificacion:$('identificacion').value,razonSocial:$('razon').value,email:$('email').value,sustento:$('sustento').value,motivo:$('detalle').value};}catch(err){$('msg').textContent='❌ El JSON de datos SRI no es válido.';return;}datos.identificacion=datos.identificacion||$('identificacion').value;datos.razonSocial=datos.razonSocial||$('razon').value;const r=await fetch('/api/documentos',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({emisorId,tipo,datos,estado:'borrador'})});const d=await r.json();$('msg').textContent=r.ok?'✅ Borrador guardado.':'❌ '+(d.error||'Error');if(r.ok) cargar()};async function emitir(id){if(!confirm('¿Transmitir este documento al SRI ahora? La emisión será fiscal y no debe repetirse.'))return;const r=await fetch('/api/documentos/'+id+'/emitir',{method:'POST'});const d=await r.json();$('msg').textContent=r.ok?'✅ '+(d.estado||'Documento procesado'):'❌ '+(d.error||'Error al emitir');cargar()}renderTabs();cargar();
</script></body></html>
